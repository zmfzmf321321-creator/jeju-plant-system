<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>발전소 계측제어 설비 맵</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b132b; color: #fff; overflow: hidden; }

    #auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0b132b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .auth-box {
      background: #1c2541;
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid #3a506b;
      width: 90%;
      max-width: 340px;
      text-align: center;
    }
    .auth-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #48cae4; }
    .auth-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }

    .auth-input {
      width: 100%;
      padding: 12px;
      background: #0b132b;
      border: 1px solid #3a506b;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    .auth-input:focus { border-color: #00b4d8; }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #00b4d8;
      color: #0b132b;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-biometric {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
      color: #64748b;
      font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid #334155;
    }
    .auth-divider span { padding: 0 10px; }

    .btn-admin-pass {
      width: 100%;
      padding: 11px;
      background: #111a33;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-toggle-link {
      margin-top: 14px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
      text-decoration: underline;
    }
    .auth-status-error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; line-height: 1.4; }

    #admin-login-box, #register-box { display: none; }

    #header {
      height: 52px;
      background: #1c2541;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 2px solid #3a506b;
    }
    #header .brand { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    #header .location-tag { background: #48cae4; color: #0b132b; padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; align-items: center; }
    .btn-bio-reg { background: #065f46; border: 1px solid #10b981; color: #a7f3d0; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .btn-logout { background: transparent; border: 1px solid #64748b; color: #cbd5e1; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }

    /* 지도 및 하단 컨트롤러 레이아웃 */
    #main-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
    }
    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #0f172a;
    }
    #map { width: 100%; height: 100%; background: #0f172a; z-index: 10; }

    /* 하단 선택 바 (Bottom Control Bar) */
    #bottom-control-bar {
      height: 64px;
      background: #111a33;
      border-top: 2px solid #3a506b;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 500;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
    }
    .select-dropdown {
      background: #1c2541;
      color: #48cae4;
      border: 1px solid #3a506b;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      max-width: 120px;
    }
    .floor-btn-group {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      flex: 1;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .floor-btn-group::-webkit-scrollbar { display: none; }
    .floor-chip-btn {
      flex-shrink: 0;
      height: 38px;
      min-width: 44px;
      padding: 0 10px;
      background: #1c2541;
      color: #94a3b8;
      border: 1px solid #3a506b;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .floor-chip-btn.active {
      background: #00b4d8;
      color: #0b132b;
      border-color: #90e0ef;
    }

    /* 2배 커진 사진 핀 스타일 */
    .photo-pin-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid #00b4d8;
      box-shadow: 0 0 16px rgba(0, 180, 216, 0.9), 0 4px 10px rgba(0,0,0,0.7);
      background: #1c2541;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-pin-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-pin-badge {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 19, 43, 0.92);
      color: #fff;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leaflet-popup-content-wrapper {
      background: #1c2541;
      color: #fff;
      border-radius: 12px;
      border: 1px solid #3a506b;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .leaflet-popup-tip { background: #1c2541; }
    .popup-card { font-size: 13px; line-height: 1.5; min-width: 190px; }
    .popup-card b { font-size: 15px; color: #48cae4; display: block; margin-bottom: 4px; }
    .popup-card .field-tag { color: #94a3b8; font-size: 11px; margin-right: 4px; }
    .popup-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin: 8px 0; border: 1px solid #334155; }
    .btn-delete-pin {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      background: #ef4444;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 20px; border-radius: 12px; z-index: 2000; width: 88%; max-width: 360px; color: #333; max-height: 90vh; overflow-y: auto; }
    #modal h3 { margin: 0 0 12px 0; font-size: 16px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-wrap { display: flex; gap: 8px; margin-top: 14px; }
    .btn-wrap button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #0077b6; color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .photo-preview { width: 100%; height: 120px; background: #f1f5f9; border: 1px dashed #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 6px; overflow: hidden; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div id="auth-overlay">
  <div id="login-box" class="auth-box">
    <div class="auth-title">🔐 시스템 로그인</div>
    <div class="auth-desc">발전소 계측제어 설비 관리 시스템</div>
    
    <button class="btn-biometric" id="btnBioLogin">👆 기기 생체/지문 즉시 로그인</button>
    <div id="bioLoginMsg" class="auth-status-error"></div>
    
    <div class="auth-divider"><span>또는 사번 로그인</span></div>
    
    <input type="text" id="loginEmail" class="auth-input" placeholder="사번(이메일 형식: 12345@jeju.com)">
    <input type="password" id="loginPassword" class="auth-input" placeholder="비밀번호">
    <button class="auth-btn" id="btnMemberLogin">팀원 로그인</button>
    <div id="loginMsg" class="auth-status-error"></div>
    
    <div class="auth-toggle-link" id="linkToRegister">신규 팀원 계정 등록(신청)</div>
    <div class="auth-divider"><span>또는</span></div>
    <button class="btn-admin-pass" id="btnGoAdmin">👑 관리자 비밀번호로 즉시 입장</button>
  </div>

  <div id="admin-login-box" class="auth-box">
    <div class="auth-title" style="color: #38bdf8;">👑 관리자 마스터 모드</div>
    <div class="auth-desc">마스터 비밀번호를 입력하세요.</div>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="마스터 비밀번호">
    <button class="auth-btn" style="background: #38bdf8;" id="btnAdminSubmit">관리자 즉시 접속</button>
    <div id="adminErrorMsg" class="auth-status-error">⚠️ 비밀번호가 일치하지 않습니다.</div>
    <div class="auth-toggle-link" id="linkBackLogin">일반 로그인으로 돌아가기</div>
  </div>

  <div id="register-box" class="auth-box">
    <div class="auth-title">📝 신규 팀원 등록 신청</div>
    <div class="auth-desc">가입 신청 후 관리자의 승인이 완료되어야 로그인할 수 있습니다.</div>
    <input type="text" id="regName" class="auth-input" placeholder="이름 (예: 홍길동)">
    <input type="text" id="regEmail" class="auth-input" placeholder="사번 (예: 240101@jeju.com)">
    <input type="password" id="regPassword" class="auth-input" placeholder="비밀번호 (6자리 이상)">
    <button class="auth-btn" id="btnRegisterSubmit">가입 신청하기</button>
    <div id="regMsg" class="auth-status-error"></div>
    <div class="auth-toggle-link" id="linkBackLogin2">로그인 화면으로 돌아가기</div>
  </div>
</div>

<div id="header">
  <div class="brand">
    <span>⚡ 계측제어 설비 맵</span>
    <span class="location-tag" id="current-location-badge">기력 2호기 > 보일러 > 1F</span>
  </div>
  <div class="header-btns">
    <span id="headerUserName" style="color: #48cae4; font-weight: bold; font-size: 12px;"></span>
    <button class="btn-bio-reg" id="btnRegisterBio">👆 기기 지문 등록</button>
    <button class="btn-logout" id="btnLogout">로그아웃</button>
  </div>
</div>

<div id="main-container">
  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- 하단 카테고리 / 층수 선택 바 -->
  <div id="bottom-control-bar">
    <select id="main-cat-select" class="select-dropdown">
      <option value="thermal2">기력 2호기</option>
      <option value="thermal3">기력 3호기</option>
      <option value="thermal_common">기력 공통</option>
      <option value="diesel1">내연 1호기</option>
      <option value="diesel2">내연 2호기</option>
      <option value="diesel_common">내연 공통</option>
    </select>

    <select id="sub-cat-select" class="select-dropdown">
      <!-- 자바스크립트로 동적 생성 -->
    </select>

    <div class="floor-btn-group" id="floor-btn-group">
      <!-- 층수 버튼 동적 생성 -->
    </div>
  </div>
</div>

<div id="modal">
  <h3>계측기 등록 (<span id="modal-location-text">1F</span>)</h3>
  <div class="form-group"><label>Tag No.</label><input type="text" id="tagNo" placeholder="예: 20-PT-101"></div>
  <div class="form-group"><label>기기명</label><input type="text" id="name" placeholder="예: 보일러 급수 압력"></div>
  <div class="form-group"><label>모델명</label><input type="text" id="model"></div>
  <div class="form-group"><label>측정범위 / 신호</label><input type="text" id="range"></div>
  <div class="form-group"><label>실례가</label><input type="text" id="price"></div>
  
  <div class="form-group">
    <label>현장 사진 첨부</label>
    <input type="file" id="instPhoto" accept="image/*" capture="environment">
    <div class="photo-preview" id="photoPreviewBox">
      <span id="photoPreviewText" style="font-size: 12px; color: #94a3b8;">촬영 또는 사진 선택</span>
      <img id="photoPreviewImg" src="" alt="미리보기">
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn-save" id="btnSaveInst">저장</button>
    <button class="btn-cancel" id="btnCancelInst">취소</button>
  </div>
</div>

<script>
  const ADMIN_MASTER_PASS = 'dydy423156!!##';
  const SUPABASE_URL = 'https://euohxdxddvyldtfdvpkk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3OXbhWhj04w_eFGMpu83w_ZbybQ_t_';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 카테고리 및 도면 매핑 구조
  const CATEGORY_TREE = {
    thermal2: {
      name: '기력 2호기',
      subs: {
        boiler: { name: '보일러', floors: [1,2,3,4,5,6,7,8], images: { 1: './floor1.png', 2: './floor2.jpg' } },
        turbine: { name: '터빈', floors: [1,2,3,4], images: {} }
      }
    },
    thermal3: {
      name: '기력 3호기',
      subs: {
        boiler: { name: '보일러', floors: [1,2,3,4,5,6,7,8], images: {} },
        turbine: { name: '터빈', floors: [1,2,3,4], images: {} }
      }
    },
    thermal_common: {
      name: '기력 공통',
      subs: {
        oiltank: { name: '기름 탱크', floors: [1], images: {} },
        pumproom: { name: '연료펌프룸', floors: [1], images: {} }
      }
    },
    diesel1: {
      name: '내연 1호기',
      subs: {
        main: { name: '본관', floors: [1,2], images: {} }
      }
    },
    diesel2: {
      name: '내연 2호기',
      subs: {
        main: { name: '본관', floors: [1,2], images: {} }
      }
    },
    diesel_common: {
      name: '내연 공통',
      subs: {
        main: { name: '공통구역', floors: [1], images: {} }
      }
    }
  };

  let currentMain = 'thermal2';
  let currentSub = 'boiler';
  let currentFloor = 1;

  let currentCoord = { x: 0, y: 0 };
  let currentInstruments = [];
  let currentMarkerObjects = [];
  let mapInstance = null;
  let selectedPhotoBlob = null;
  let currentUserInfo = { name: '', email: '' };

  function bufferToBase64(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)));
  }
  function base64ToBuffer(base64) {
    return Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer;
  }

  document.getElementById('btnGoAdmin').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('admin-login-box').style.display = 'block';
  });

  document.getElementById('linkBackLogin').addEventListener('click', () => {
    document.getElementById('admin-login-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });

  document.getElementById('linkToRegister').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('register-box').style.display = 'block';
  });

  document.getElementById('linkBackLogin2').addEventListener('click', () => {
    document.getElementById('register-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });

  document.getElementById('btnAdminSubmit').addEventListener('click', () => {
    const val = document.getElementById('adminPassInput').value.trim();
    if (val === ADMIN_MASTER_PASS) {
      sessionStorage.setItem('jeju_admin_auth', 'true');
      unlock('👑 최고관리자', 'admin@jeju.com');
    } else {
      document.getElementById('adminErrorMsg').style.display = 'block';
    }
  });

  document.getElementById('btnLogout').addEventListener('click', () => {
    sessionStorage.removeItem('jeju_admin_auth');
    supabaseClient.auth.signOut().then(() => location.reload());
  });

  function unlock(name, email = 'user@jeju.com') {
    currentUserInfo = { name: name, email: email };
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('headerUserName').innerText = name;
    initMapOnce();
    renderCategorySelectors();
  }

  // 지문 등록
  document.getElementById('btnRegisterBio').addEventListener('click', async () => {
    if (!window.PublicKeyCredential) {
      alert('이 기기는 생체인식 센서를 지원하지 않습니다.');
      return;
    }
    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const userId = new Uint8Array(16);
      window.crypto.getRandomValues(userId);

      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: "계측관리 시스템", id: window.location.hostname },
          user: {
            id: userId,
            name: currentUserInfo.email || "user@jeju.com",
            displayName: currentUserInfo.name || "사용자"
          },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: {
            authenticatorAttachment: "platform",
            residentKey: "preferred",
            userVerification: "required"
          },
          timeout: 60000
        }
      });

      if (credential) {
        const rawIdBase64 = bufferToBase64(credential.rawId);
        localStorage.setItem('jeju_bio_credential_id', rawIdBase64);
        localStorage.setItem('jeju_bio_user', currentUserInfo.name || "사용자");
        localStorage.setItem('jeju_bio_email', currentUserInfo.email || "user@jeju.com");
        alert('✅ 기기 지문 등록 완료!');
      }
    } catch (err) {
      alert('지문 등록 실패: ' + err.message);
    }
  });

  // 지문 로그인
  document.getElementById('btnBioLogin').addEventListener('click', async () => {
    const credIdBase64 = localStorage.getItem('jeju_bio_credential_id');
    const msg = document.getElementById('bioLoginMsg');
    
    if (!credIdBase64) {
      msg.innerText = '⚠️ 이 기기에 등록된 지문 키가 없습니다. 먼저 사번 로그인 후 [기기 지문 등록]을 진행해 주세요.';
      msg.style.display = 'block';
      return;
    }

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const credIdBuffer = base64ToBuffer(credIdBase64);

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: challenge,
          rpId: window.location.hostname,
          allowCredentials: [{ id: credIdBuffer, type: 'public-key' }],
          userVerification: "required",
          timeout: 60000
        }
      });

      if (assertion) {
        sessionStorage.setItem('jeju_admin_auth', 'true');
        const user = localStorage.getItem('jeju_bio_user') || '팀원';
        const email = localStorage.getItem('jeju_bio_email') || 'user@jeju.com';
        unlock(user, email);
      }
    } catch (err) {
      msg.innerText = '⚠️ 지문 인증 실패: ' + err.message;
      msg.style.display = 'block';
    }
  });

  // 팀원 가입 신청
  document.getElementById('btnRegisterSubmit').addEventListener('click', async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const msg = document.getElementById('regMsg');
    
    if (!name || !email || !pass) { msg.innerText = '⚠️ 모든 항목을 입력해주세요.'; msg.style.display = 'block'; return; }
    if (pass.length < 6) { msg.innerText = '⚠️ 비밀번호는 6자리 이상이어야 합니다.'; msg.style.display = 'block'; return; }
    if (!email.includes('@') || !email.includes('.')) { msg.innerText = '⚠️ 사번을 이메일 형식으로 입력해주세요.'; msg.style.display = 'block'; return; }

    msg.style.display = 'none';
    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: pass,
      options: { data: { full_name: name, approved: false } }
    });

    if (error) { 
      msg.innerText = '⚠️ 가입 오류: ' + error.message; 
      msg.style.display = 'block'; 
    } else { 
      alert('📋 가입 신청 접수 완료! 관리자 승인 후 로그인할 수 있습니다.'); 
      location.reload(); 
    }
  });

  // 팀원 로그인
  document.getElementById('btnMemberLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
    if (error) { 
      msg.innerText = '⚠️ 사번 또는 비밀번호가 일치하지 않습니다.'; 
      msg.style.display = 'block'; 
      return; 
    }

    if (data.user.user_metadata?.approved !== true) {
      alert('🚫 관리자 승인 대기 중인 계정입니다.');
      await supabaseClient.auth.signOut();
      return;
    }

    unlock(data.user.user_metadata?.full_name || '팀원', data.user.email);
  });

  // 사진 압축
  function compressImage(file, maxWidth = 1000, quality = 0.75) {
    return new Promise((resolve) => {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      };
    });
  }

  document.getElementById('instPhoto').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) {
      selectedPhotoBlob = await compressImage(file, 1000, 0.8);
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('photoPreviewImg').src = ev.target.result;
        document.getElementById('photoPreviewImg').style.display = 'block';
        document.getElementById('photoPreviewText').style.display = 'none';
      };
      reader.readAsDataURL(selectedPhotoBlob);
    }
  });

  // 지도 인스턴스
  const mapWidth = 3000;
  const mapHeight = 2100;
  const bounds = [[0, 0], [mapHeight, mapWidth]];
  let floorLayer = null;

  function initMapOnce() {
    if (mapInstance) return;
    mapInstance = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 3,
      zoomSnap: 0.1,
      zoomDelta: 0.5,
      attributionControl: false
    });

    mapInstance.on('click', (e) => {
      if (e.latlng.lat < 0 || e.latlng.lat > mapHeight || e.latlng.lng < 0 || e.latlng.lng > mapWidth) return;
      currentCoord.y = Math.round(e.latlng.lat);
      currentCoord.x = Math.round(e.latlng.lng);
      selectedPhotoBlob = null;
      document.getElementById('tagNo').value = '';
      document.getElementById('name').value = '';
      document.getElementById('model').value = '';
      document.getElementById('range').value = '';
      document.getElementById('price').value = '';
      document.getElementById('instPhoto').value = '';
      document.getElementById('photoPreviewImg').style.display = 'none';
      document.getElementById('photoPreviewText').style.display = 'block';
      document.getElementById('modal').style.display = 'block';
    });

    mapInstance.on('zoomend', () => {
      renderMarkers();
    });
  }

  // 하단 선택창 이벤트 및 동적 렌더링
  function renderCategorySelectors() {
    const mainSelect = document.getElementById('main-cat-select');
    const subSelect = document.getElementById('sub-cat-select');

    mainSelect.value = currentMain;
    updateSubCategorySelect();

    mainSelect.onchange = (e) => {
      currentMain = e.target.value;
      const subs = Object.keys(CATEGORY_TREE[currentMain].subs);
      currentSub = subs[0];
      updateSubCategorySelect();
    };

    subSelect.onchange = (e) => {
      currentSub = e.target.value;
      updateFloorButtons();
    };
  }

  function updateSubCategorySelect() {
    const subSelect = document.getElementById('sub-cat-select');
    subSelect.innerHTML = '';
    const currentSubs = CATEGORY_TREE[currentMain].subs;
    const subKeys = Object.keys(currentSubs);

    // 내연호기 등 단독 대분류일 경우 소분류 셀렉터 숨김
    if (subKeys.length === 1 && subKeys[0] === 'main') {
      subSelect.style.display = 'none';
    } else {
      subSelect.style.display = 'block';
      subKeys.forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.innerText = currentSubs[k].name;
        subSelect.appendChild(opt);
      });
      subSelect.value = currentSub;
    }

    updateFloorButtons();
  }

  function updateFloorButtons() {
    const floorGroup = document.getElementById('floor-btn-group');
    floorGroup.innerHTML = '';
    const subData = CATEGORY_TREE[currentMain].subs[currentSub];
    const floors = subData.floors;

    if (!floors.includes(currentFloor)) {
      currentFloor = floors[0];
    }

    floors.forEach(f => {
      const btn = document.createElement('button');
      btn.className = `floor-chip-btn ${f === currentFloor ? 'active' : ''}`;
      btn.innerText = `${f}F`;
      btn.onclick = () => {
        currentFloor = f;
        updateFloorButtons();
        loadFloorPlan();
      };
      floorGroup.appendChild(btn);
    });

    loadFloorPlan();
  }

  function drawGrid(floorText) {
    const canvas = document.createElement('canvas');
    canvas.width = mapWidth;
    canvas.height = mapHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a1128';
    ctx.fillRect(0, 0, mapWidth, mapHeight);
    ctx.strokeStyle = '#162347';
    ctx.lineWidth = 1;
    for (let i = 0; i <= mapWidth; i += 50) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, mapHeight); ctx.stroke();
    }
    for (let i = 0; i <= mapHeight; i += 50) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(mapWidth, i); ctx.stroke();
    }
    ctx.strokeStyle = '#00b4d8';
    ctx.lineWidth = 8;
    ctx.strokeRect(10, 10, mapWidth - 20, mapHeight - 20);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.font = 'bold 300px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(floorText, mapWidth / 2, mapHeight / 2);
    return canvas.toDataURL();
  }

  function loadFloorPlan() {
    const mainName = CATEGORY_TREE[currentMain].name;
    const subData = CATEGORY_TREE[currentMain].subs[currentSub];
    const subName = subData.name === '본관' || subData.name === '공통구역' ? '' : ` > ${subData.name}`;
    const locationString = `${mainName}${subName} > ${currentFloor}F`;

    document.getElementById('current-location-badge').innerText = locationString;
    document.getElementById('modal-location-text').innerText = locationString;

    if (floorLayer) mapInstance.removeLayer(floorLayer);

    const imageUrl = (subData.images && subData.images[currentFloor]) || drawGrid(`${currentFloor}F`);
    floorLayer = L.imageOverlay(imageUrl, bounds).addTo(mapInstance);
    mapInstance.fitBounds(bounds);
    fetchInstruments();
  }

  window.deleteInstrument = async function(id) {
    if (!confirm('이 계측기를 영구 삭제하시겠습니까?')) return;
    mapInstance.closePopup();
    
    const { error } = await supabaseClient.from('instruments').delete().eq('id', id);
    if (error) {
      alert('삭제 실패: ' + error.message);
    } else {
      fetchInstruments();
    }
  };

  async function fetchInstruments() {
    const locationKey = `${currentMain}_${currentSub}`;
    const { data, error } = await supabaseClient.from('instruments')
      .select('*')
      .eq('floor', currentFloor);
      
    if (error) return;
    currentInstruments = data || [];
    renderMarkers();
  }

  // 2배 확대된 크기로 핀 렌더링 (45px ~ 160px)
  function renderMarkers() {
    currentMarkerObjects.forEach(m => mapInstance.removeLayer(m));
    currentMarkerObjects = [];

    const zoom = mapInstance.getZoom();
    // 기존 대비 2배 확대된 핀 크기 계산
    const calculatedSize = Math.max(45, Math.min(160, Math.round(90 + zoom * 16)));
    const badgeDisplay = calculatedSize < 50 ? 'none' : 'block';

    currentInstruments.forEach(item => {
      let marker;
      if (item.photo_url && item.photo_url.trim() !== '') {
        const photoIcon = L.divIcon({
          className: 'leaflet-photo-icon',
          html: `
            <div class="photo-pin-container" style="width:${calculatedSize}px; height:${calculatedSize}px;">
              <img src="${item.photo_url}" class="photo-pin-img">
              <div class="photo-pin-badge" style="display:${badgeDisplay}; font-size:${Math.max(10, calculatedSize * 0.16)}px;">${item.tag_no}</div>
            </div>
          `,
          iconSize: [calculatedSize, calculatedSize],
          iconAnchor: [calculatedSize / 2, calculatedSize / 2]
        });
        marker = L.marker([item.y_coord, item.x_coord], { icon: photoIcon }).addTo(mapInstance);
      } else {
        marker = L.marker([item.y_coord, item.x_coord]).addTo(mapInstance);
      }

      let popupContent = `
        <div class="popup-card">
          <b>${item.tag_no}</b>
          <div><span class="field-tag">기기명</span>${item.name}</div>
          ${item.model ? `<div><span class="field-tag">모델명</span>${item.model}</div>` : ''}
          ${item.signal_range ? `<div><span class="field-tag">범위/신호</span>${item.signal_range}</div>` : ''}
          ${item.price ? `<div><span class="field-tag">실례가</span>${item.price}</div>` : ''}
          ${item.photo_url ? `<img src="${item.photo_url}" class="popup-img">` : ''}
          <button class="btn-delete-pin" onclick="window.deleteInstrument('${item.id}')">🗑️ 계측기 삭제</button>
        </div>
      `;
      marker.bindPopup(popupContent);
      currentMarkerObjects.push(marker);
    });
  }

  document.getElementById('btnCancelInst').addEventListener('click', () => {
    document.getElementById('modal').style.display = 'none';
  });

  document.getElementById('btnSaveInst').addEventListener('click', async () => {
    const saveBtn = document.getElementById('btnSaveInst');
    const tagNo = document.getElementById('tagNo').value.trim();
    const name = document.getElementById('name').value.trim();
    if (!tagNo || !name) { alert('Tag No와 기기명은 필수입니다.'); return; }

    saveBtn.innerText = '저장 중...';
    saveBtn.disabled = true;

    let photoUrl = null;
    if (selectedPhotoBlob) {
      const fileName = `${Date.now()}_${tagNo.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`;
      const { error: uploadErr } = await supabaseClient.storage.from('instrument-photos').upload(fileName, selectedPhotoBlob, {
        contentType: 'image/jpeg',
        upsert: true
      });
      if (!uploadErr) {
        const { data: publicUrlData } = supabaseClient.storage.from('instrument-photos').getPublicUrl(fileName);
        photoUrl = publicUrlData.publicUrl;
      }
    }

    const { error: insertErr } = await supabaseClient.from('instruments').insert([{
      floor: currentFloor,
      tag_no: tagNo,
      name: name,
      model: document.getElementById('model').value.trim(),
      signal_range: document.getElementById('range').value.trim(),
      price: document.getElementById('price').value.trim(),
      photo_url: photoUrl,
      x_coord: currentCoord.x,
      y_coord: currentCoord.y
    }]);

    saveBtn.innerText = '저장';
    saveBtn.disabled = false;

    if (insertErr) {
      alert('저장 실패: ' + insertErr.message);
      return;
    }

    document.getElementById('modal').style.display = 'none';
    fetchInstruments();
  });

  if (sessionStorage.getItem('jeju_admin_auth') === 'true') {
    unlock('👑 최고관리자', 'admin@jeju.com');
  }
</script>
