<!-- 변경 전: <model-viewer id="boilerViewer" ...> -->

<!-- 변경 후: 선명한 명암 및 부드러운 터치 조작 적용 -->
<model-viewer id="boilerViewer" src="./boiler.glb"
  camera-controls
  touch-action="none"
  interpolation-decay="200"
  environment-image="neutral"
  shadow-intensity="1.8"
  shadow-softness="0.4"
  exposure="0.9"
  auto-rotate-delay="3000"
  min-camera-orbit="auto auto 5%"
  max-camera-orbit="auto auto 200%">
</model-viewer>
