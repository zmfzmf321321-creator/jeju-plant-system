<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>보일러 계측제어 3D 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #080d1a; color: #fff;
      overflow: hidden;
      position: fixed;
    }

    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0b132b; display: flex; align-items: center; justify-content: center;
      z-index: 99999;
    }
    .auth-box {
      background: #1c2541; padding: 28px 24px; border-radius: 16px;
      border: 1px solid #3a506b; width: 90%; max-width: 340px; text-align: center;
    }
    .auth-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #48cae4; }
    .auth-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
    .auth-input {
      width: 100%; padding: 12px; background: #0b132b; border: 1px solid #3a506b;
      border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    .auth-btn {
      width: 100%; padding: 12px; background: #00b4d8; color: #0b132b;
      border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px;
    }
    .btn-biometric {
      width: 100%; padding: 12px; background: #10b981; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: bold;
      cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .auth-divider { display: flex; align-items: center; margin: 16px 0; color: #64748b; font-size: 12px; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .auth-divider span { padding: 0 10px; }
    .btn-admin-pass {
      width: 100%; padding: 11px; background: #111a33; border: 1px solid #3b82f6;
      color: #93c5fd; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .auth-toggle-link { margin-top: 14px; font-size: 13px; color: #94a3b8; cursor: pointer; text-decoration: underline; }
    .auth-status-error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; line-height: 1.4; }
    #admin-login-box, #register-box { display: none; }

    #header {
      position: fixed; top: 0; left: 0; width: 100vw; height: 50px;
      background: #1c2541; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 2px solid #3a506b; z-index: 5000;
    }
    .brand { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .location-tag { background: #48cae4; color: #0b132b; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .btn-bio-reg { background: #065f46; border: 1px solid #10b981; color: #a7f3d0; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .btn-logout { background: transparent; border: 1px solid #64748b; color: #cbd5e1; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }

    /* 화면 컨테이너 공통 */
    #main-viewport {
      position: fixed; top: 50px; bottom: 65px; left: 0; width: 100vw;
      background: radial-gradient(circle at center, #1b2838 0%, #080d1a 100%);
      z-index: 10; overflow: hidden;
    }

    /* 1. 전체 조감도 3D 모드 */
    #overall-3d-view {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    }
    model-viewer {
      width: 100%; height: 100%; --poster-color: transparent;
    }
    model-viewer::part(default-progress-bar), model-viewer::part(prompt) {
      display: none !important;
    }

    /* 2. 각 층별 전용 독립 작업 공간 모드 */
    #floor-room-view {
      display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
      background: #0d1527; user-select: none; touch-action: none;
    }
    
    /* 층 내부 상단 헤더 알림판 */
    #floor-room-header {
      position: absolute; top: 12px; left: 12px; right: 12px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid #00b4d8;
      border-radius: 10px; padding: 10px 14px; display: flex;
      justify-content: space-between; align-items: center; z-index: 30;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    .room-title { font-size: 15px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .room-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .btn-exit-room {
      background: #0284c7; color: #fff; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    /* 이동 가능한 층 평면도 캔버스 */
    #floor-canvas-wrap {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0;
      cursor: grab; overflow: hidden;
    }
    #floor-board {
      width: 1200px; height: 1200px; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: 
        linear-gradient(rgba(0, 180, 216, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 216, 0.08) 1px, transparent 1px),
        radial-gradient(ellipse at center, #172554 0%, #0b132b 100%);
      background-size: 40px 40px, 40px 40px, 100% 100%;
      border: 2px solid #1e40af; border-radius: 16px;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    /* 보일러 본체 및 설비 평면 윤곽 */
    .plant-layout-box {
      position: absolute; border: 2px dashed #0284c7; background: rgba(2, 132, 199, 0.08);
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: #7dd3fc;
      border-radius: 8px; font-size: 14px;
    }
    .boiler-core { top: 250px; left: 350px; width: 500px; height: 500px; border-style: solid; border-color: #38bdf8; }
    .burner-zone { top: 780px; left: 350px; width: 500px; height: 160px; }
    .piping-zone-left { top: 250px; left: 100px; width: 220px; height: 500px; }
    .piping-zone-right { top: 250px; left: 880px; width: 220px; height: 500px; }

    /* 층 내부 전용 계측기 핀 */
    .floor-inst-pin {
      position: absolute; width: 34px; height: 34px; border-radius: 50%;
      background: #00b4d8; border: 2px solid #ffffff;
      box-shadow: 0 0 14px rgba(0, 180, 216, 1);
      display: flex; align-items: center; justify-content: center;
      color: #0b132b; font-size: 14px; font-weight: bold; cursor: pointer;
      transform: translate(-50%, -50%); z-index: 50;
    }
    .floor-inst-pin span {
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      background: rgba(11, 19, 43, 0.9); color: #fff; padding: 2px 6px;
      border-radius: 4px; font-size: 11px; white-space: nowrap; border: 1px solid #38bdf8;
    }

    /* 줌 컨트롤러 */
    .canvas-zoom-ctrl {
      position: absolute; right: 14px; bottom: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 40;
    }
    .zoom-btn {
      width: 42px; height: 42px; border-radius: 8px; background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8; color: #fff; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* 하단 층수 바 */
    #floor-bar {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 65px;
      background: #111a33; border-top: 2px solid #3a506b; display: flex;
      align-items: center; padding: 0 10px; gap: 6px; z-index: 5000;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #floor-bar::-webkit-scrollbar { display: none; }
    .floor-btn {
      flex-shrink: 0; height: 42px; min-width: 58px; padding: 0 10px;
      background: #1c2541; color: #94a3b8; border: 1px solid #3a506b;
      border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
      white-space: nowrap;
    }
    .floor-btn.active {
      background: #00b4d8; color: #0b132b; border-color: #90e0ef;
    }

    /* 모달 공통 */
    #modal, #info-modal, #history-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #ffffff; padding: 20px; border-radius: 12px; z-index: 999999;
      width: 90%; max-width: 360px; color: #333; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    #modal h3, #info-modal h3, #history-modal h3 { margin: 0 0 12px 0; font-size: 16px; color: #0b132b; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: inherit; color: #111; }
    .btn-wrap { display: flex; gap: 8px; margin-top: 14px; }
    .btn-wrap button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #0077b6; color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #475569; }

    .history-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #cbd5e1; }
    .history-title { font-size: 13px; font-weight: bold; color: #0284c7; margin-bottom: 8px; }
    .history-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .history-item { background: #f8fafc; border-left: 3px solid #0284c7; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
    .btn-add-history-quick { width: 100%; padding: 9px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-bottom: 6px; }
    .btn-delete-pin { width: 100%; padding: 8px; background: #ef4444; border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div id="auth-overlay">
  <div id="login-box" class="auth-box">
    <div class="auth-title">🔐 시스템 로그인</div>
    <div class="auth-desc">보일러 계측제어 관리 시스템</div>
    <button class="btn-biometric" id="btnBioLogin">👆 기기 생체/지문 즉시 로그인</button>
    <div id="bioLoginMsg" class="auth-status-error"></div>
    <div class="auth-divider"><span>또는 사번 로그인</span></div>
    <input type="text" id="loginEmail" class="auth-input" placeholder="사번(이메일: 12345@jeju.com)">
    <input type="password" id="loginPassword" class="auth-input" placeholder="비밀번호">
    <button class="auth-btn" id="btnMemberLogin">팀원 로그인</button>
    <div id="loginMsg" class="auth-status-error"></div>
    <div class="auth-toggle-link" id="linkToRegister">신규 팀원 계정 신청</div>
    <div class="auth-divider"><span>또는</span></div>
    <button class="btn-admin-pass" id="btnGoAdmin">👑 최고관리자 즉시 입장</button>
  </div>

  <div id="admin-login-box" class="auth-box">
    <div class="auth-title" style="color: #38bdf8;">👑 최고관리자 모드</div>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="마스터 비밀번호">
    <button class="auth-btn" style="background: #38bdf8;" id="btnAdminSubmit">관리자 접속</button>
    <div id="adminErrorMsg" class="auth-status-error">⚠️ 비밀번호가 틀렸습니다.</div>
    <div class="auth-toggle-link" id="linkBackLogin">돌아가기</div>
  </div>

  <div id="register-box" class="auth-box">
    <div class="auth-title">📝 신규 팀원 가입</div>
    <input type="text" id="regName" class="auth-input" placeholder="이름">
    <input type="text" id="regEmail" class="auth-input" placeholder="사번 (12345@jeju.com)">
    <input type="password" id="regPassword" class="auth-input" placeholder="비밀번호 (6자리 이상)">
    <button class="auth-btn" id="btnRegisterSubmit">가입 신청</button>
    <div id="regMsg" class="auth-status-error"></div>
    <div class="auth-toggle-link" id="linkBackLogin2">돌아가기</div>
  </div>
</div>

<div id="header">
  <div class="brand">
    <span>⚡ 제주 보일러 계측관리</span>
    <span class="location-tag" id="currentFloorTag">보일러 전체</span>
  </div>
  <div class="header-btns">
    <button class="btn-bio-reg" id="btnRegisterBio">👆 지문 등록</button>
    <button class="btn-logout" id="btnLogout">로그아웃</button>
  </div>
</div>

<div id="main-viewport">
  <!-- 모드 1: 전체 조감도 3D 화면 -->
  <div id="overall-3d-view">
    <model-viewer id="boilerViewer" src="./boiler.glb"
      interaction-prompt="none"
      orientation="90deg 270deg 210deg"
      camera-orbit="0deg 75deg 380m"
      camera-target="auto auto auto"
      camera-controls
      touch-action="pan-y"
      interpolation-decay="150"
      environment-image="neutral"
      shadow-intensity="1.5"
      shadow-softness="0.5"
      exposure="1.0">
    </model-viewer>
  </div>

  <!-- 모드 2: 층별 독립 전용 작업 공간 화면 -->
  <div id="floor-room-view">
    <div id="floor-room-header">
      <div>
        <div class="room-title" id="roomTitleText">📍 1층 작업 공간</div>
        <div class="room-desc">원하는 위치를 터치하여 계측기 등록 | 드래그로 평면 이동</div>
      </div>
      <button class="btn-exit-room" onclick="exitToOverall()">🌐 조감도로 나가기</button>
    </div>

    <!-- 이동 및 줌이 가능한 층별 보드 -->
    <div id="floor-canvas-wrap">
      <div id="floor-board">
        <div class="plant-layout-box boiler-core">보일러 본체 (Furnace Core)</div>
        <div class="plant-layout-box burner-zone">버너 & 급기 밸브 라인</div>
        <div class="plant-layout-box piping-zone-left">주 급수/증기 배관 A</div>
        <div class="plant-layout-box piping-zone-right">주 급수/증기 배관 B</div>
        <!-- 핀들이 동적으로 여기에 꽂힘 -->
      </div>
    </div>

    <div class="canvas-zoom-ctrl">
      <button class="zoom-btn" onclick="zoomCanvas(0.2)">＋</button>
      <button class="zoom-btn" onclick="zoomCanvas(-0.2)">－</button>
      <button class="zoom-btn" onclick="resetCanvasView()" style="font-size: 13px;">리셋</button>
    </div>
  </div>
</div>

<!-- 13개 층수 버튼 바 -->
<div id="floor-bar">
  <button class="floor-btn active" id="btn-ALL" onclick="exitToOverall()">전체</button>
  <button class="floor-btn" onclick="openFloorRoom('1층', this)">1층</button>
  <button class="floor-btn" onclick="openFloorRoom('2층', this)">2층</button>
  <button class="floor-btn" onclick="openFloorRoom('2.5층', this)">2.5층</button>
  <button class="floor-btn" onclick="openFloorRoom('3층', this)">3층</button>
  <button class="floor-btn" onclick="openFloorRoom('3.1/3층', this)">3.1/3층</button>
  <button class="floor-btn" onclick="openFloorRoom('3.2/3층', this)">3.2/3층</button>
  <button class="floor-btn" onclick="openFloorRoom('4층', this)">4층</button>
  <button class="floor-btn" onclick="openFloorRoom('4.5층', this)">4.5층</button>
  <button class="floor-btn" onclick="openFloorRoom('5층', this)">5층</button>
  <button class="floor-btn" onclick="openFloorRoom('5.5층', this)">5.5층</button>
  <button class="floor-btn" onclick="openFloorRoom('6층', this)">6층</button>
  <button class="floor-btn" onclick="openFloorRoom('7층', this)">7층</button>
  <button class="floor-btn" onclick="openFloorRoom('루프탑', this)">루프탑</button>
</div>

<!-- 계측기 등록 모달 -->
<div id="modal">
  <h3>계측기 등록 (<span id="modalFloorText" style="color:#00b4d8; font-weight:bold;">1층</span>)</h3>
  <div class="form-group"><label>Tag No.</label><input type="text" id="tagNo" placeholder="예: 20-PT-101"></div>
  <div class="form-group"><label>기기명</label><input type="text" id="name" placeholder="예: 급수 압력 전송기"></div>
  <div class="form-group"><label>모델명</label><input type="text" id="model"></div>
  <div class="form-group"><label>측정범위 / 신호</label><input type="text" id="range"></div>
  <div class="btn-wrap">
    <button class="btn-save" id="btnSaveInst">저장</button>
    <button class="btn-cancel" onclick="document.getElementById('modal').style.display='none'">취소</button>
  </div>
</div>

<!-- 핀 상세 모달 -->
<div id="info-modal">
  <h3 id="infoTitle">계측기 상세</h3>
  <div id="infoBody" style="font-size: 13px; line-height: 1.5;"></div>
  <div class="history-section">
    <div class="history-title">📋 정비/점검 이력</div>
    <div class="history-list" id="infoHistoryList"></div>
    <button class="btn-add-history-quick" id="btnAddHistBtn">+ 점검/정비 이력 추가</button>
  </div>
  <button class="btn-delete-pin" id="btnDeletePin">🗑️ 계측기 삭제</button>
  <div class="btn-wrap" style="margin-top: 10px;">
    <button class="btn-cancel" onclick="document.getElementById('info-modal').style.display='none'">닫기</button>
  </div>
</div>

<!-- 이력 추가 모달 -->
<div id="history-modal">
  <h3>📋 정비/점검 이력 추가</h3>
  <div style="font-size: 13px; color: #0284c7; font-weight: bold; margin-bottom: 12px;" id="histTargetTag"></div>
  <div class="form-group"><label>작업일자</label><input type="date" id="histDate"></div>
  <div class="form-group"><label>작업자</label><input type="text" id="histAuthor"></div>
  <div class="form-group"><label>내용</label><textarea id="histContent" rows="3" placeholder="점검 내역 입력"></textarea></div>
  <div class="btn-wrap">
    <button class="btn-save" id="btnSaveHist">이력 저장</button>
    <button class="btn-cancel" onclick="document.getElementById('history-modal').style.display='none'">취소</button>
  </div>
</div>

<script>
  const ADMIN_MASTER_PASS = 'dydy423156!!##';
  const SUPABASE_URL = 'https://euohxdxddvyldtfdvpkk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3OXbhWhj04w_eFGMpu83w_ZbybQ_t_';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentInstruments = [];
  let currentUserInfo = { name: '', email: '' };
  let selectedFloor = 'ALL';
  let activeTargetId = null;
  let clickedFloorCoord = { x: 0, y: 0 };

  // 층 평면 보드 제스처 상태
  let scale = 0.8;
  let panX = 0, panY = 0;
  let isPanning = false;
  let startX = 0, startY = 0;

  function unlock(name, email = 'user@jeju.com') {
    currentUserInfo = { name: name, email: email };
    document.getElementById('auth-overlay').style.display = 'none';
    fetchInstruments();
  }

  // 로그인 관리
  document.getElementById('btnGoAdmin').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('admin-login-box').style.display = 'block';
  });
  document.getElementById('linkBackLogin').addEventListener('click', () => {
    document.getElementById('admin-login-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });
  document.getElementById('linkToRegister').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('register-box').style.display = 'block';
  });
  document.getElementById('linkBackLogin2').addEventListener('click', () => {
    document.getElementById('register-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });
  document.getElementById('btnAdminSubmit').addEventListener('click', () => {
    if (document.getElementById('adminPassInput').value.trim() === ADMIN_MASTER_PASS) {
      sessionStorage.setItem('jeju_admin_auth', 'true');
      unlock('👑 최고관리자', 'admin@jeju.com');
    } else {
      document.getElementById('adminErrorMsg').style.display = 'block';
    }
  });
  document.getElementById('btnLogout').addEventListener('click', () => {
    sessionStorage.removeItem('jeju_admin_auth');
    location.reload();
  });

  // [화면 전환] 특정 층 독립 공간으로 완전 이동
  window.openFloorRoom = function(floor, btn) {
    selectedFloor = floor;
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    // 3D 조감도 숨기고 -> 층별 독립 전용 공간 표시
    document.getElementById('overall-3d-view').style.display = 'none';
    document.getElementById('floor-room-view').style.display = 'block';

    document.getElementById('currentFloorTag').innerText = `보일러 ${floor}`;
    document.getElementById('roomTitleText').innerText = `📍 [보일러 ${floor}] 설비 전용 작업 공간`;

    resetCanvasView();
    renderFloorPins();
  };

  // [화면 전환] 전체 3D 조감도로 탈출
  window.exitToOverall = function() {
    selectedFloor = 'ALL';
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-ALL').classList.add('active');

    document.getElementById('floor-room-view').style.display = 'none';
    document.getElementById('overall-3d-view').style.display = 'block';
    document.getElementById('currentFloorTag').innerText = '보일러 전체';
  };

  // 층 보드 드래그 & 줌 인터랙션
  const canvasWrap = document.getElementById('floor-canvas-wrap');
  const board = document.getElementById('floor-board');

  function updateTransform() {
    board.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
  }

  window.zoomCanvas = function(delta) {
    scale = Math.max(0.4, Math.min(2.5, scale + delta));
    updateTransform();
  };

  window.resetCanvasView = function() {
    scale = 0.8; panX = 0; panY = 0;
    updateTransform();
  };

  canvasWrap.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('floor-inst-pin')) return;
    isPanning = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
    canvasWrap.style.cursor = 'grabbing';
  });

  window.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    updateTransform();
  });

  window.addEventListener('pointerup', () => {
    isPanning = false;
    canvasWrap.style.cursor = 'grab';
  });

  // 층 바닥을 터치하여 신규 핀 등록
  board.addEventListener('click', (e) => {
    if (e.target.closest('.floor-inst-pin')) return;
    const rect = board.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) / scale;
    const clickY = (e.clientY - rect.top) / scale;

    clickedFloorCoord = { x: Math.round(clickX), y: Math.round(clickY) };

    document.getElementById('tagNo').value = '';
    document.getElementById('name').value = '';
    document.getElementById('model').value = '';
    document.getElementById('range').value = '';
    document.getElementById('modalFloorText').innerText = selectedFloor;
    document.getElementById('modal').style.display = 'block';
  });

  // Supabase에 계측기 저장 (해당 층 고정)
  document.getElementById('btnSaveInst').addEventListener('click', async () => {
    const tag = document.getElementById('tagNo').value.trim();
    const name = document.getElementById('name').value.trim();
    if (!tag || !name) { alert('Tag No와 기기명을 입력하세요.'); return; }

    const { error } = await supabaseClient.from('instruments').insert([{
      location_key: 'boiler_2d',
      floor: selectedFloor,
      tag_no: tag,
      name: name,
      model: document.getElementById('model').value.trim(),
      signal_range: document.getElementById('range').value.trim(),
      coord_x: clickedFloorCoord.x,
      coord_y: clickedFloorCoord.y,
      history_logs: []
    }]);

    if (!error) {
      document.getElementById('modal').style.display = 'none';
      fetchInstruments();
    } else {
      alert('저장 실패: ' + error.message);
    }
  });

  async function fetchInstruments() {
    const { data, error } = await supabaseClient.from('instruments').select('*').eq('location_key', 'boiler_2d');
    if (!error) {
      currentInstruments = data || [];
      renderFloorPins();
    }
  }

  // 해당 층 전용 핀 렌더링
  function renderFloorPins() {
    board.querySelectorAll('.floor-inst-pin').forEach(el => el.remove());

    currentInstruments.forEach(item => {
      if (item.floor !== selectedFloor) return; // 다른 층 핀은 절대 노출되지 않음

      const pin = document.createElement('div');
      pin.className = 'floor-inst-pin';
      pin.style.left = `${item.coord_x}px`;
      pin.style.top = `${item.coord_y}px`;
      pin.innerHTML = `📍<span>${item.tag_no}</span>`;

      pin.onclick = (e) => {
        e.stopPropagation();
        showDetail(item);
      };
      board.appendChild(pin);
    });
  }

  function showDetail(item) {
    activeTargetId = item.id;
    document.getElementById('infoTitle').innerText = `[${item.tag_no}] ${item.name}`;
    document.getElementById('infoBody').innerHTML = `
      <div><b>배치 구역:</b> <span style="color:#0284c7; font-weight:bold;">${item.floor}</span></div>
      <div><b>모델명:</b> ${item.model || '-'}</div>
      <div><b>측정범위/신호:</b> ${item.signal_range || '-'}</div>
    `;

    const logs = Array.isArray(item.history_logs) ? item.history_logs : [];
    let histHtml = logs.length > 0 ? logs.map(h => `
      <div class="history-item">
        <div style="color:#64748b; font-size:11px;">${h.date} (${h.author})</div>
        <div style="color:#111;">${h.content}</div>
      </div>
    `).join('') : '<div style="color:#94a3b8; font-size:11px;">등록된 점검 이력이 없습니다.</div>';
    document.getElementById('infoHistoryList').innerHTML = histHtml;

    document.getElementById('btnAddHistBtn').onclick = () => {
      document.getElementById('info-modal').style.display = 'none';
      document.getElementById('histTargetTag').innerText = `[${item.tag_no}] ${item.name}`;
      document.getElementById('histDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('histAuthor').value = currentUserInfo.name || '';
      document.getElementById('histContent').value = '';
      document.getElementById('history-modal').style.display = 'block';
    };

    document.getElementById('btnDeletePin').onclick = async () => {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      await supabaseClient.from('instruments').delete().eq('id', item.id);
      document.getElementById('info-modal').style.display = 'none';
      fetchInstruments();
    };

    document.getElementById('info-modal').style.display = 'block';
  }

  document.getElementById('btnSaveHist').addEventListener('click', async () => {
    const text = document.getElementById('histContent').value.trim();
    if (!text) { alert('내용을 입력하세요.'); return; }

    const target = currentInstruments.find(i => i.id === activeTargetId);
    const logs = Array.isArray(target.history_logs) ? target.history_logs : [];
    const newEntry = {
      date: document.getElementById('histDate').value,
      author: document.getElementById('histAuthor').value || '작업자',
      content: text
    };
    const updated = [newEntry, ...logs];

    const { error } = await supabaseClient.from('instruments').update({ history_logs: updated }).eq('id', activeTargetId);
    if (!error) {
      target.history_logs = updated;
      document.getElementById('history-modal').style.display = 'none';
      alert('✅ 이력이 저장되었습니다.');
    }
  });

  if (sessionStorage.getItem('jeju_admin_auth') === 'true') {
    unlock('👑 최고관리자', 'admin@jeju.com');
  }
</script>
</body>
</html>
