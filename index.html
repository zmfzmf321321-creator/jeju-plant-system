<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>보일러 계측제어 관리 시스템</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #080d1a; color: #fff; overflow: hidden; position: fixed; }

    #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b132b; display: flex; align-items: center; justify-content: center; z-index: 99999; }
    .auth-box { background: #1c2541; padding: 28px 24px; border-radius: 16px; border: 1px solid #3a506b; width: 90%; max-width: 340px; text-align: center; }
    .auth-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #48cae4; }
    .auth-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
    .auth-input { width: 100%; padding: 12px; background: #0b132b; border: 1px solid #3a506b; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
    .auth-btn { width: 100%; padding: 12px; background: #00b4d8; color: #0b132b; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-biometric { width: 100%; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-divider { display: flex; align-items: center; margin: 16px 0; color: #64748b; font-size: 12px; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .auth-divider span { padding: 0 10px; }
    .btn-admin-pass { width: 100%; padding: 11px; background: #111a33; border: 1px solid #3b82f6; color: #93c5fd; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .auth-toggle-link { margin-top: 14px; font-size: 13px; color: #94a3b8; cursor: pointer; text-decoration: underline; }
    .auth-status-error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; line-height: 1.4; }
    #admin-login-box, #register-box { display: none; }

    #header { height: 52px; background: #1c2541; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 2px solid #3a506b; z-index: 1000; }
    #header .brand { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    #header .floor-tag { background: #48cae4; color: #0b132b; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .btn-bio-reg { background: #065f46; border: 1px solid #10b981; color: #a7f3d0; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .btn-logout { background: transparent; border: 1px solid #64748b; color: #cbd5e1; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }

    #container { display: flex; height: calc(100vh - 52px); width: 100vw; position: relative; }
    #floor-selector { width: 72px; background: #111a33; border-right: 1px solid #1c2541; display: flex; flex-direction: column; gap: 6px; padding: 8px 6px; z-index: 500; overflow-y: auto; }
    .floor-btn { width: 100%; height: 44px; background: #1c2541; color: #94a3b8; border: 1px solid #3a506b; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .floor-btn.active { background: #00b4d8; color: #0b132b; border-color: #90e0ef; }
    #map-wrapper { flex: 1; height: 100%; position: relative; background: #070d1d; }
    #map { width: 100%; height: 100%; background: #070d1d; z-index: 10; }

    .leaflet-popup-content-wrapper { background: #1c2541; color: #fff; border-radius: 12px; border: 1px solid #3a506b; }
    .leaflet-popup-tip { background: #1c2541; }
    .popup-card { font-size: 13px; line-height: 1.5; min-width: 190px; }
    .popup-card b { font-size: 15px; color: #48cae4; display: block; margin-bottom: 4px; }
    .popup-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 6px; margin: 6px 0; }
    .btn-delete-pin { width: 100%; padding: 7px; margin-top: 8px; background: #ef4444; border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }

    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 20px; border-radius: 12px; z-index: 2000; width: 88%; max-width: 360px; color: #333; max-height: 90vh; overflow-y: auto; }
    #modal h3 { margin: 0 0 12px 0; font-size: 16px; color: #0b132b; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-wrap { display: flex; gap: 8px; margin-top: 14px; }
    .btn-wrap button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #0077b6; color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .photo-preview { width: 100%; height: 110px; background: #f1f5f9; border: 1px dashed #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 6px; overflow: hidden; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }

    /* Gemini 플로팅 챗봇 버튼 & 창 */
    #ai-fab-btn {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 28px;
      background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; border: 2px solid #90e0ef;
      font-size: 26px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 4000; box-shadow: 0 6px 20px rgba(0,180,216,0.5);
    }
    #ai-chat-panel {
      display: none; position: fixed; bottom: 90px; right: 20px; width: 340px; height: 480px;
      background: #1c2541; border: 1px solid #3a506b; border-radius: 16px; z-index: 4000;
      flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .ai-chat-header {
      background: #111a33; padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #3a506b; font-weight: bold; font-size: 14px; color: #48cae4;
    }
    .ai-chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .ai-msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; word-break: break-word; }
    .ai-msg.user { align-self: flex-end; background: #0077b6; color: #fff; border-bottom-right-radius: 2px; }
    .ai-msg.gemini { align-self: flex-start; background: #0b132b; color: #e2e8f0; border: 1px solid #3a506b; border-bottom-left-radius: 2px; white-space: pre-wrap; }
    .ai-chat-input-wrap { display: flex; padding: 10px; background: #111a33; border-top: 1px solid #3a506b; gap: 6px; }
    .ai-chat-input-wrap input { flex: 1; background: #0b132b; border: 1px solid #3a506b; border-radius: 8px; color: #fff; padding: 8px 12px; font-size: 13px; outline: none; }
    .ai-chat-input-wrap button { background: #00b4d8; color: #0b132b; border: none; border-radius: 8px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div id="auth-overlay">
  <div id="login-box" class="auth-box">
    <div class="auth-title">🔐 시스템 로그인</div>
    <div class="auth-desc">보일러 계측기 관리 시스템</div>
    <button class="btn-biometric" id="btnBioLogin">👆 태블릿 생체/지문 즉시 로그인</button>
    <div id="bioLoginMsg" class="auth-status-error"></div>
    <div class="auth-divider"><span>또는 사번 로그인</span></div>
    <input type="text" id="loginEmail" class="auth-input" placeholder="사번(이메일 형태: 12345@jeju.com)">
    <input type="password" id="loginPassword" class="auth-input" placeholder="비밀번호">
    <button class="auth-btn" id="btnMemberLogin">팀원 로그인</button>
    <div id="loginMsg" class="auth-status-error"></div>
    <div class="auth-toggle-link" id="linkToRegister">신규 팀원 계정 등록(신청)</div>
    <div class="auth-divider"><span>또는</span></div>
    <button class="btn-admin-pass" id="btnGoAdmin">👑 관리자 비밀번호로 즉시 입장</button>
  </div>

  <div id="admin-login-box" class="auth-box">
    <div class="auth-title" style="color: #38bdf8;">👑 관리자 마스터 모드</div>
    <div class="auth-desc">마스터 비밀번호를 입력하세요.</div>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="마스터 비밀번호">
    <button class="auth-btn" style="background: #38bdf8;" id="btnAdminSubmit">관리자 즉시 접속</button>
    <div id="adminErrorMsg" class="auth-status-error">⚠️ 비밀번호가 일치하지 않습니다.</div>
    <div class="auth-toggle-link" id="linkBackLogin">일반 로그인으로 돌아가기</div>
  </div>

  <div id="register-box" class="auth-box">
    <div class="auth-title">📝 신규 팀원 등록</div>
    <div class="auth-desc">신청 후 관리자 승인이 필요합니다.</div>
    <input type="text" id="regName" class="auth-input" placeholder="이름 (예: 홍길동)">
    <input type="text" id="regEmail" class="auth-input" placeholder="사번 (예: 12345@jeju.com)">
    <input type="password" id="regPassword" class="auth-input" placeholder="비밀번호 (6자리 이상)">
    <button class="auth-btn" id="btnRegisterSubmit">가입 신청</button>
    <div id="regMsg" class="auth-status-error"></div>
    <div class="auth-toggle-link" id="linkBackLogin2">로그인 화면으로 돌아가기</div>
  </div>
</div>

<div id="header">
  <div class="brand">
    <span>🏢 보일러 계측제어 맵</span>
    <span class="floor-tag" id="current-floor-badge">1F (Boiler)</span>
  </div>
  <div class="header-btns">
    <button class="btn-bio-reg" id="btnRegisterBio">👆 지문 등록</button>
    <button class="btn-logout" id="btnLogout">로그아웃</button>
  </div>
</div>

<div id="container">
  <div id="floor-selector">
    <button class="floor-btn" data-floor="8">8F</button>
    <button class="floor-btn" data-floor="7">7F</button>
    <button class="floor-btn" data-floor="6">6F</button>
    <button class="floor-btn" data-floor="5">5F</button>
    <button class="floor-btn" data-floor="4">4F</button>
    <button class="floor-btn" data-floor="3">3F</button>
    <button class="floor-btn" data-floor="2">2F</button>
    <button class="floor-btn active" data-floor="1">1F</button>
  </div>
  <div id="map-wrapper">
    <div id="map"></div>
  </div>
</div>

<!-- 계측기 등록 모달 -->
<div id="modal">
  <h3>계측기 등록 (<span id="modal-floor-text">1F</span>)</h3>
  <div class="form-group"><label>Tag No.</label><input type="text" id="tagNo" placeholder="예: 20-PT-101"></div>
  <div class="form-group"><label>기기명</label><input type="text" id="name" placeholder="예: 보일러 급수 압력"></div>
  <div class="form-group"><label>모델명</label><input type="text" id="model" placeholder="예: Rosemount 3051S"></div>
  <div class="form-group"><label>측정범위 / 신호</label><input type="text" id="range" placeholder="예: 0~25 MPa"></div>
  <div class="form-group"><label>실례가</label><input type="text" id="price"></div>
  <div class="form-group">
    <label>현장 사진 첨부</label>
    <input type="file" id="instPhoto" accept="image/*" capture="environment">
    <div class="photo-preview">
      <span id="photoPreviewText" style="font-size: 12px; color: #94a3b8;">촬영 또는 사진 선택</span>
      <img id="photoPreviewImg" src="" alt="미리보기">
    </div>
  </div>
  <div class="btn-wrap">
    <button class="btn-save" id="btnSaveInst">저장</button>
    <button class="btn-cancel" id="btnCancelInst">취소</button>
  </div>
</div>

<!-- Gemini 챗봇 플로팅 버튼 & 창 -->
<div id="ai-fab-btn" onclick="toggleAIChat()">🤖</div>
<div id="ai-chat-panel">
  <div class="ai-chat-header">
    <span>🤖 계측 정비 AI 가이드</span>
    <span style="cursor:pointer; font-size:16px;" onclick="toggleAIChat()">✖</span>
  </div>
  <div class="ai-chat-messages" id="aiChatMsgs">
    <div class="ai-msg gemini">안녕하세요! 계측기 고장 진단, 점검 절차, 영점 조정, 에러코드 대처법을 편하게 질문해 주세요.</div>
  </div>
  <div class="ai-chat-input-wrap">
    <input type="text" id="aiInput" placeholder="예: PT 오차 발생 시 점검 순서는?" onkeydown="if(event.key==='Enter') sendAIMessage()">
    <button onclick="sendAIMessage()">전송</button>
  </div>
</div>

<script>
  // 업데이트해주신 Gemini API 키 반영 완료
  const GEMINI_API_KEY = 'AIzaSyAevsssJ-WerHFSPaX31ZL5x9IHxr1VbLY';

  const ADMIN_MASTER_PASS = 'dydy423156!!##';
  const SUPABASE_URL = 'https://euohxdxddvyldtfdvpkk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3OXbhWhj04w_eFGMpu83w_ZbybQ_t_';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const FLOOR_IMAGES = { 1: './floor1.png', 2: './floor2.jpg' };
  let currentFloor = 1;
  let currentCoord = { x: 0, y: 0 };
  let currentInstruments = [];
  let currentMarkerObjects = [];
  let mapInstance = null;
  let selectedPhotoBlob = null;
  let currentUserInfo = { name: '', email: '' };

  function bufferToBase64(buffer) { return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
  function base64ToBuffer(base64) { return Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer; }

  // 인증 제어
  document.getElementById('btnGoAdmin').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('admin-login-box').style.display = 'block';
  });
  document.getElementById('linkBackLogin').addEventListener('click', () => {
    document.getElementById('admin-login-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });
  document.getElementById('linkToRegister').addEventListener('click', () => {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('register-box').style.display = 'block';
  });
  document.getElementById('linkBackLogin2').addEventListener('click', () => {
    document.getElementById('register-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
  });

  document.getElementById('btnAdminSubmit').addEventListener('click', () => {
    if (document.getElementById('adminPassInput').value.trim() === ADMIN_MASTER_PASS) {
      sessionStorage.setItem('jeju_admin_auth', 'true');
      unlock('👑 최고관리자', 'admin@jeju.com');
    } else {
      document.getElementById('adminErrorMsg').style.display = 'block';
    }
  });

  document.getElementById('btnLogout').addEventListener('click', () => {
    sessionStorage.removeItem('jeju_admin_auth');
    supabaseClient.auth.signOut().then(() => location.reload());
  });

  function unlock(name, email = 'user@jeju.com') {
    currentUserInfo = { name: name, email: email };
    document.getElementById('auth-overlay').style.display = 'none';
    initMapOnce();
    switchFloor(1);
  }

  // 지문 등록 / 로그인
  document.getElementById('btnRegisterBio').addEventListener('click', async () => {
    if (!window.PublicKeyCredential) { alert('생체인식 센서를 지원하지 않는 기기입니다.'); return; }
    try {
      const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
      const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: "보일러 계측관리 시스템", id: window.location.hostname },
          user: { id: userId, name: currentUserInfo.email || "user@jeju.com", displayName: currentUserInfo.name || "사용자" },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "preferred", userVerification: "required" },
          timeout: 60000
        }
      });
      if (credential) {
        localStorage.setItem('jeju_bio_credential_id', bufferToBase64(credential.rawId));
        localStorage.setItem('jeju_bio_user', currentUserInfo.name || "사용자");
        localStorage.setItem('jeju_bio_email', currentUserInfo.email || "user@jeju.com");
        alert('✅ 기기 지문 등록 완료!');
      }
    } catch (err) { alert('지문 등록 실패: ' + err.message); }
  });

  document.getElementById('btnBioLogin').addEventListener('click', async () => {
    const credIdBase64 = localStorage.getItem('jeju_bio_credential_id');
    const msg = document.getElementById('bioLoginMsg');
    if (!credIdBase64) {
      msg.innerText = '⚠️ 이 기기에 등록된 지문 키가 없습니다. 사번 로그인 후 [지문 등록]을 먼저 진행해 주세요.';
      msg.style.display = 'block'; return;
    }
    try {
      const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: challenge, rpId: window.location.hostname,
          allowCredentials: [{ id: base64ToBuffer(credIdBase64), type: 'public-key' }],
          userVerification: "required", timeout: 60000
        }
      });
      if (assertion) {
        sessionStorage.setItem('jeju_admin_auth', 'true');
        unlock(localStorage.getItem('jeju_bio_user') || '팀원', localStorage.getItem('jeju_bio_email') || 'user@jeju.com');
      }
    } catch (err) {
      msg.innerText = '⚠️ 지문 인증 실패: ' + err.message; msg.style.display = 'block';
    }
  });

  document.getElementById('btnMemberLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
    if (error) { document.getElementById('loginMsg').innerText = '⚠️ 사번 또는 비밀번호가 틀립니다.'; document.getElementById('loginMsg').style.display = 'block'; return; }
    if (data.user.user_metadata?.approved !== true) { alert('🚫 승인 대기 중인 계정입니다.'); await supabaseClient.auth.signOut(); return; }
    unlock(data.user.user_metadata?.full_name || '팀원', data.user.email);
  });

  document.getElementById('btnRegisterSubmit').addEventListener('click', async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const { error } = await supabaseClient.auth.signUp({ email: email, password: pass, options: { data: { full_name: name, approved: false } } });
    if (error) { document.getElementById('regMsg').innerText = error.message; document.getElementById('regMsg').style.display = 'block'; }
    else { alert('가입 신청 완료! 관리자 승인 후 로그인하세요.'); location.reload(); }
  });

  // 지도 생성 (가로 3000 x 세로 2100)
  const mapWidth = 3000, mapHeight = 2100;
  const bounds = [[0, 0], [mapHeight, mapWidth]];
  let floorLayer = null;

  function initMapOnce() {
    if (mapInstance) return;
    mapInstance = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 3, zoomSnap: 0.1, zoomDelta: 0.5, attributionControl: false });
    mapInstance.on('click', (e) => {
      if (e.latlng.lat < 0 || e.latlng.lat > mapHeight || e.latlng.lng < 0 || e.latlng.lng > mapWidth) return;
      currentCoord.y = Math.round(e.latlng.lat);
      currentCoord.x = Math.round(e.latlng.lng);
      selectedPhotoBlob = null;
      document.getElementById('tagNo').value = '';
      document.getElementById('name').value = '';
      document.getElementById('model').value = '';
      document.getElementById('range').value = '';
      document.getElementById('price').value = '';
      document.getElementById('instPhoto').value = '';
      document.getElementById('photoPreviewImg').style.display = 'none';
      document.getElementById('photoPreviewText').style.display = 'block';
      document.getElementById('modal').style.display = 'block';
    });
  }

  function drawGrid(floor) {
    const canvas = document.createElement('canvas');
    canvas.width = mapWidth; canvas.height = mapHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a1128'; ctx.fillRect(0, 0, mapWidth, mapHeight);
    ctx.strokeStyle = '#162347'; ctx.lineWidth = 1;
    for (let i = 0; i <= mapWidth; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, mapHeight); ctx.stroke(); }
    for (let i = 0; i <= mapHeight; i += 50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(mapWidth, i); ctx.stroke(); }
    ctx.strokeStyle = '#00b4d8'; ctx.lineWidth = 8;
    ctx.strokeRect(10, 10, mapWidth - 20, mapHeight - 20);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${floor}F`, mapWidth / 2, mapHeight / 2);
    return canvas.toDataURL();
  }

  function switchFloor(f) {
    currentFloor = f;
    document.getElementById('current-floor-badge').innerText = `${f}F (Boiler)`;
    document.getElementById('modal-floor-text').innerText = `${f}F`;
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.floor) === f));
    if (floorLayer) mapInstance.removeLayer(floorLayer);
    floorLayer = L.imageOverlay(FLOOR_IMAGES[f] || drawGrid(f), bounds).addTo(mapInstance);
    mapInstance.fitBounds(bounds);
    fetchInstruments(f);
  }

  document.querySelectorAll('.floor-btn').forEach(btn => {
    btn.addEventListener('click', () => switchFloor(parseInt(btn.dataset.floor)));
  });

  async function fetchInstruments(floor) {
    const { data } = await supabaseClient.from('instruments').select('*').eq('floor', floor);
    currentInstruments = data || [];
    currentMarkerObjects.forEach(m => mapInstance.removeLayer(m));
    currentMarkerObjects = [];

    currentInstruments.forEach(item => {
      const marker = L.marker([item.y_coord, item.x_coord]).addTo(mapInstance);
      let popupContent = `
        <div class="popup-card">
          <b>${item.tag_no}</b>
          <div>기기명: ${item.name}</div>
          ${item.model ? `<div>모델명: ${item.model}</div>` : ''}
          ${item.signal_range ? `<div>범위: ${item.signal_range}</div>` : ''}
          ${item.photo_url ? `<img src="${item.photo_url}" class="popup-img">` : ''}
          <button class="btn-delete-pin" onclick="deleteInst(${item.id})">🗑️ 삭제</button>
        </div>`;
      marker.bindPopup(popupContent);
      currentMarkerObjects.push(marker);
    });
  }

  window.deleteInst = async function(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    mapInstance.closePopup();
    await supabaseClient.from('instruments').delete().eq('id', id);
    fetchInstruments(currentFloor);
  };

  document.getElementById('btnCancelInst').addEventListener('click', () => { document.getElementById('modal').style.display = 'none'; });
  document.getElementById('btnSaveInst').addEventListener('click', async () => {
    const tagNo = document.getElementById('tagNo').value.trim();
    const name = document.getElementById('name').value.trim();
    if (!tagNo || !name) { alert('Tag No와 기기명은 필수입니다.'); return; }

    await supabaseClient.from('instruments').insert([{
      floor: currentFloor,
      tag_no: tagNo,
      name: name,
      model: document.getElementById('model').value.trim(),
      signal_range: document.getElementById('range').value.trim(),
      price: document.getElementById('price').value.trim(),
      x_coord: currentCoord.x,
      y_coord: currentCoord.y
    }]);

    document.getElementById('modal').style.display = 'none';
    fetchInstruments(currentFloor);
  });

  // ================= Gemini AI 질의 연동 =================
  function toggleAIChat() {
    const panel = document.getElementById('ai-chat-panel');
    panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
  }

  async function sendAIMessage() {
    const input = document.getElementById('aiInput');
    const q = input.value.trim();
    if (!q) return;

    const chatMsgs = document.getElementById('aiChatMsgs');
    chatMsgs.innerHTML += `<div class="ai-msg user">${q}</div>`;
    input.value = '';
    chatMsgs.scrollTop = chatMsgs.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    chatMsgs.innerHTML += `<div class="ai-msg gemini" id="${loadingId}">답변 생성 중... ⏳</div>`;
    chatMsgs.scrollTop = chatMsgs.scrollHeight;

    try {
      const systemInstruction = `당신은 화력발전소 보일러 계측제어 정비 엔지니어입니다. PT(압력 전송기), FT(유량계), TE(온도센서), LT(레벨 전송기), 제어밸브 등의 오차 점검 절차, 영점 조정 방법, 에러 코드 해결법을 실무 작업자 입장에서 간결하고 이해하기 쉬운 1단계, 2단계 순서로 답변하세요.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `${systemInstruction}\n\n[작업자 질문]: ${q}` }] }]
        })
      });

      const data = await response.json();
      const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || '⚠️ 답변을 가져오지 못했습니다.';
      document.getElementById(loadingId).innerText = answer;
    } catch (err) {
      document.getElementById(loadingId).innerText = '⚠️ 오류 발생: ' + err.message;
    }
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
  }

  if (sessionStorage.getItem('jeju_admin_auth') === 'true') {
    unlock('👑 최고관리자', 'admin@jeju.com');
  }
</script>
