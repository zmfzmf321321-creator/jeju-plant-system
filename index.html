<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>보일러 계측기 관리 시스템</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Three.js 및 GLTFLoader, OrbitControls 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b132b; color: #fff; overflow: hidden; }

    #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b132b; display: flex; align-items: center; justify-content: center; z-index: 99999; }
    .auth-box { background: #1c2541; padding: 28px 24px; border-radius: 16px; border: 1px solid #3a506b; width: 90%; max-width: 340px; text-align: center; }
    .auth-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #48cae4; }
    .auth-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
    .auth-input { width: 100%; padding: 12px; background: #0b132b; border: 1px solid #3a506b; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
    .auth-btn { width: 100%; padding: 12px; background: #00b4d8; color: #0b132b; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-admin-pass { width: 100%; padding: 11px; background: #111a33; border: 1px solid #3b82f6; color: #93c5fd; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .auth-status-error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; line-height: 1.4; }

    #header { height: 56px; background: #1c2541; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid #3a506b; }
    #header .brand { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    #header .floor-tag { background: #48cae4; color: #0b132b; padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; align-items: center; }
    .btn-3d { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1px solid #38bdf8; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-logout { background: transparent; border: 1px solid #64748b; color: #cbd5e1; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    #container { display: flex; height: calc(100vh - 56px); width: 100vw; position: relative; }
    #floor-selector { width: 76px; background: #111a33; border-right: 1px solid #1c2541; display: flex; flex-direction: column; gap: 6px; padding: 8px 6px; z-index: 500; overflow-y: auto; }
    .floor-btn { width: 100%; height: 46px; background: #1c2541; color: #94a3b8; border: 1px solid #3a506b; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .floor-btn.active { background: #00b4d8; color: #0b132b; border-color: #90e0ef; }

    #map-wrapper { flex: 1; height: 100%; position: relative; background: #0f172a; }
    #map { width: 100%; height: 100%; background: #0f172a; z-index: 10; }

    /* 3D 모달 오버레이 */
    #modal-3d { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; }
    #viewer-3d-wrap { width: 100%; height: 100%; position: relative; }
    #canvas-3d { width: 100%; height: 100%; display: block; }
    .btn-close-3d { position: absolute; top: 16px; right: 16px; background: #ef4444; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 10001; }
    .info-3d { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(11, 19, 43, 0.85); padding: 8px 16px; border-radius: 20px; border: 1px solid #3a506b; font-size: 12px; color: #90e0ef; pointer-events: none; }

    /* 2D 핀 팝업 및 등록 모달 */
    .photo-pin-container { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #00b4d8; box-shadow: 0 0 10px rgba(0, 180, 216, 0.8); background: #1c2541; cursor: pointer; overflow: hidden; }
    .photo-pin-img { width: 100%; height: 100%; object-fit: cover; }
    .photo-pin-badge { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(11, 19, 43, 0.9); color: #fff; font-size: 8px; text-align: center; font-weight: bold; white-space: nowrap; overflow: hidden; }
    .leaflet-popup-content-wrapper { background: #1c2541; color: #fff; border-radius: 12px; border: 1px solid #3a506b; }
    .leaflet-popup-tip { background: #1c2541; }
    .popup-card { font-size: 13px; line-height: 1.5; min-width: 180px; }
    .popup-card b { font-size: 15px; color: #48cae4; display: block; margin-bottom: 4px; }
    .popup-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin: 8px 0; border: 1px solid #334155; }
    .btn-delete-pin { width: 100%; padding: 8px; margin-top: 10px; background: #ef4444; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }

    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 20px; border-radius: 12px; z-index: 2000; width: 88%; max-width: 360px; color: #333; max-height: 90vh; overflow-y: auto; }
    #modal h3 { margin: 0 0 12px 0; font-size: 16px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-wrap { display: flex; gap: 8px; margin-top: 14px; }
    .btn-wrap button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #0077b6; color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .photo-preview { width: 100%; height: 120px; background: #f1f5f9; border: 1px dashed #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 6px; overflow: hidden; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-title">🔐 시스템 로그인</div>
    <div class="auth-desc">보일러 계측기 관리 시스템</div>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="마스터 비밀번호">
    <button class="auth-btn" id="btnAdminSubmit">관리자 접속</button>
    <div id="adminErrorMsg" class="auth-status-error">⚠️ 비밀번호가 일치하지 않습니다.</div>
  </div>
</div>

<div id="header">
  <div class="brand">
    <span>🏢 보일러 계측제어 맵</span>
    <span class="floor-tag" id="current-floor-badge">1F (EL.6800)</span>
  </div>
  <div class="header-btns">
    <button class="btn-3d" id="btnOpen3D">🧊 3D 입체 뷰어</button>
    <button class="btn-logout" id="btnLogout">로그아웃</button>
  </div>
</div>

<div id="container">
  <div id="floor-selector">
    <button class="floor-btn" data-floor="8">8F</button>
    <button class="floor-btn" data-floor="7">7F</button>
    <button class="floor-btn" data-floor="6">6F</button>
    <button class="floor-btn" data-floor="5">5F</button>
    <button class="floor-btn" data-floor="4">4F</button>
    <button class="floor-btn" data-floor="3">3F</button>
    <button class="floor-btn" data-floor="2">2F</button>
    <button class="floor-btn active" data-floor="1">1F</button>
  </div>
  <div id="map-wrapper">
    <div id="map"></div>
  </div>
</div>

<!-- 3D 뷰어 모달 팝업 -->
<div id="modal-3d">
  <div id="viewer-3d-wrap">
    <button class="btn-close-3d" id="btnClose3D">✖ 3D 닫기</button>
    <canvas id="canvas-3d"></canvas>
    <div class="info-3d">💡 한 손가락 드래그: 360° 회전 | 두 손가락: 확대/축소</div>
  </div>
</div>

<!-- 계측기 등록 팝업 (기존 유지) -->
<div id="modal">
  <h3>계측기 등록 (<span id="modal-floor-text">1F</span>)</h3>
  <div class="form-group"><label>Tag No.</label><input type="text" id="tagNo" placeholder="예: 20-PT-101"></div>
  <div class="form-group"><label>기기명</label><input type="text" id="name" placeholder="예: 보일러 급수 압력"></div>
  <div class="form-group"><label>모델명</label><input type="text" id="model"></div>
  <div class="form-group"><label>측정범위</label><input type="text" id="range"></div>
  <div class="form-group"><label>실례가</label><input type="text" id="price"></div>
  <div class="form-group">
    <label>현장 사진 첨부</label>
    <input type="file" id="instPhoto" accept="image/*" capture="environment">
    <div class="photo-preview">
      <img id="photoPreviewImg" src="" alt="미리보기">
    </div>
  </div>
  <div class="btn-wrap">
    <button class="btn-save" id="btnSaveInst">저장</button>
    <button class="btn-cancel" id="btnCancelInst">취소</button>
  </div>
</div>

<script>
  const ADMIN_MASTER_PASS = 'dydy423156!!##';
  const SUPABASE_URL = 'https://euohxdxddvyldtfdvpkk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3OXbhWhj04w_eFGMpu83w_ZbybQ_t_';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const FLOOR_IMAGES = { 1: './floor1_drawing.jpg' };
  let currentFloor = 1;
  let currentCoord = { x: 0, y: 0 };
  let mapInstance = null;
  let floorLayer = null;
  let currentInstruments = [];
  let currentMarkerObjects = [];
  let selectedPhotoBlob = null;

  // 로그인 인증
  document.getElementById('btnAdminSubmit').addEventListener('click', () => {
    if (document.getElementById('adminPassInput').value.trim() === ADMIN_MASTER_PASS) {
      sessionStorage.setItem('jeju_admin_auth', 'true');
      document.getElementById('auth-overlay').style.display = 'none';
      initMap();
      switchFloor(1);
    } else {
      document.getElementById('adminErrorMsg').style.display = 'block';
    }
  });

  document.getElementById('btnLogout').addEventListener('click', () => {
    sessionStorage.removeItem('jeju_admin_auth');
    location.reload();
  });

  if (sessionStorage.getItem('jeju_admin_auth') === 'true') {
    document.getElementById('auth-overlay').style.display = 'none';
    window.addEventListener('DOMContentLoaded', () => { initMap(); switchFloor(1); });
  }

  // 2D 맵 초기화
  const mapWidth = 3000, mapHeight = 2100;
  const bounds = [[0, 0], [mapHeight, mapWidth]];

  function initMap() {
    if (mapInstance) return;
    mapInstance = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 3, zoomSnap: 0.1, zoomDelta: 0.5, attributionControl: false });
    mapInstance.on('click', (e) => {
      if (e.latlng.lat < 0 || e.latlng.lat > mapHeight || e.latlng.lng < 0 || e.latlng.lng > mapWidth) return;
      currentCoord.y = Math.round(e.latlng.lat);
      currentCoord.x = Math.round(e.latlng.lng);
      document.getElementById('modal').style.display = 'block';
    });
    mapInstance.on('zoomend', renderMarkers);
  }

  function drawGrid(floor) {
    const canvas = document.createElement('canvas');
    canvas.width = mapWidth; canvas.height = mapHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a1128'; ctx.fillRect(0, 0, mapWidth, mapHeight);
    ctx.strokeStyle = '#22386d'; ctx.lineWidth = 2.5;
    for (let i = 0; i <= mapWidth; i += 250) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, mapHeight); ctx.stroke(); }
    for (let i = 0; i <= mapHeight; i += 250) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(mapWidth, i); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.font = 'bold 400px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(`${floor}F`, mapWidth / 2, mapHeight / 2);
    return canvas.toDataURL();
  }

  function switchFloor(f) {
    currentFloor = f;
    document.getElementById('current-floor-badge').innerText = f === 1 ? '1F (EL.6800)' : `${f}F`;
    document.getElementById('modal-floor-text').innerText = `${f}F`;
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.floor) === f));
    if (floorLayer) mapInstance.removeLayer(floorLayer);
    floorLayer = L.imageOverlay(FLOOR_IMAGES[f] || drawGrid(f), bounds).addTo(mapInstance);
    mapInstance.fitBounds(bounds);
    fetchInstruments(f);
  }

  document.querySelectorAll('.floor-btn').forEach(btn => {
    btn.addEventListener('click', () => switchFloor(parseInt(btn.dataset.floor)));
  });

  async function fetchInstruments(floor) {
    const { data } = await supabaseClient.from('instruments').select('*').eq('floor', floor);
    currentInstruments = data || [];
    renderMarkers();
  }

  function renderMarkers() {
    currentMarkerObjects.forEach(m => mapInstance.removeLayer(m));
    currentMarkerObjects = [];
    const zoom = mapInstance.getZoom();
    const sz = Math.max(22, Math.min(80, Math.round(44 + zoom * 8)));

    currentInstruments.forEach(item => {
      let icon = item.photo_url ? L.divIcon({
        className: 'leaflet-photo-icon',
        html: `<div class="photo-pin-container" style="width:${sz}px; height:${sz}px;"><img src="${item.photo_url}" class="photo-pin-img"><div class="photo-pin-badge">${item.tag_no}</div></div>`,
        iconSize: [sz, sz], iconAnchor: [sz/2, sz/2]
      }) : new L.Icon.Default();

      let m = L.marker([item.y_coord, item.x_coord], { icon: icon }).addTo(mapInstance);
      m.bindPopup(`<div class="popup-card"><b>${item.tag_no}</b><div>${item.name}</div>${item.photo_url ? `<img src="${item.photo_url}" class="popup-img">` : ''}</div>`);
      currentMarkerObjects.push(m);
    });
  }

  document.getElementById('btnCancelInst').addEventListener('click', () => { document.getElementById('modal').style.display = 'none'; });

  // -------------------------------------------------------------
  // [Three.js] 3D 뷰어 제어 로직 (boiler.glb 로드)
  // -------------------------------------------------------------
  let scene, camera, renderer, controls, is3DInitialized = false;

  function init3DViewer() {
    const canvas = document.getElementById('canvas-3d');
    const width = window.innerWidth;
    const height = window.innerHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070d1d);

    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(45, 60, 80);

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 조명 세팅
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 100, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 50);
    scene.add(dirLight);

    // 바닥 그리드 도우미
    const gridHelper = new THREE.GridHelper(120, 24, 0x00b4d8, 0x1c2541);
    gridHelper.position.y = 6.0;
    scene.add(gridHelper);

    // GLB 파일 불러오기 (GitHub에 업로드한 boiler.glb)
    const loader = new THREE.GLTFLoader();
    loader.load('./boiler.glb', (gltf) => {
      scene.add(gltf.scene);
    }, undefined, (err) => {
      console.warn('boiler.glb 로드 전 - 임시 큐브 대체');
      // 파일이 없을 경우 표시할 임시 큐브
      const box = new THREE.Mesh(new THREE.BoxGeometry(22, 38, 23.5), new THREE.MeshStandardMaterial({ color: 0x00b4d8, wireframe: true }));
      box.position.set(11, 25, 11.75);
      scene.add(box);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      if (document.getElementById('modal-3d').style.display === 'block') {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    is3DInitialized = true;
  }

  // 3D 뷰어 열기/닫기
  document.getElementById('btnOpen3D').addEventListener('click', () => {
    document.getElementById('modal-3d').style.display = 'block';
    if (!is3DInitialized) {
      init3DViewer();
    } else {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  document.getElementById('btnClose3D').addEventListener('click', () => {
    document.getElementById('modal-3d').style.display = 'none';
  });
</script>
</body>
</html>
